:root{color-scheme:light;--ink:#252c27;--green:#06c755;--line:#dedfd7;--paper:#f8f7f2;--yellow:#f4e69e}
*{box-sizing:border-box}body{margin:0;background:#fff;color:var(--ink);font-family:"Noto Sans JP Variable","Hiragino Kaku Gothic ProN","Yu Gothic",Meiryo,sans-serif;line-height:1.85;-webkit-font-smoothing:antialiased}a{color:inherit}a:focus-visible,summary:focus-visible{outline:3px solid #c28413;outline-offset:5px}

.character img.presenting-arm{transform-origin:56.44% 36.58%;transform:rotate(85deg)}
.action{margin-top:22px;text-align:center}.hours{font-size:12px;margin:0 0 10px}.line-button{display:flex;align-items:center;justify-content:space-between;gap:20px;min-height:80px;padding:20px;background:var(--green);color:#fff;text-decoration:none;border:1px solid transparent;border-radius:10px;font-size:20px;line-height:1.4;font-weight:700;box-shadow:0 3px 0 #05a747;touch-action:manipulation;-webkit-tap-highlight-color:transparent}.line-button:active{background:#05b34c;box-shadow:0 1px 0 #049a40}.line-icon{width:40px;height:40px;flex-shrink:0;display:block}.line-button .chevron{width:9px;height:9px;border-top:2px solid currentColor;border-right:2px solid currentColor;transform:rotate(45deg);margin-right:4px}@media(hover:hover){.line-button:hover{background:#05bc50}}.button-label{flex:1}.note{font-size:11px;color:#535940;margin:10px 0 0}
footer{padding:18px 0 24px;border-top:1px solid var(--line);font-size:10px;color:#606860}footer p{margin:10px 0 0}.footer-head{display:flex;justify-content:space-between;align-items:center;font-size:11px}.privacy{margin-top:12px}.privacy summary{font-size:11px;cursor:pointer}.privacy p{font-size:11px;line-height:1.8}.skip{position:absolute;left:10px;top:-80px;background:white;padding:10px;z-index:2}.skip:focus{top:10px}
@media(max-width:480px){.shell{padding:0 20px}header{padding:16px 0}.brand-logo{display:block;width:240px;height:auto;flex-shrink:0}.hero{padding:28px 20px;margin:0 -20px}.hero-grid{grid-template-columns:minmax(0,1fr) 130px;gap:0}.character{width:130px}h1{font-size:clamp(24px,6.6vw,31px)}.line-button{font-size:18px;min-height:80px;padding:20px}.action{margin-top:24px}}
@media(max-width:350px){.shell{padding:0 16px}.hero{padding-inline:16px;margin-inline:-16px}.brand-logo{width:168px}.hero-grid{grid-template-columns:minmax(0,1fr) 108px}.character{width:108px}h1{font-size:23px}.note{font-size:10px}}
